<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 40px; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .input-area { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; }
        .add-btn { background: #2563eb; color: white; }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: #dc2626; color: white; }
        li { display: flex; justify-content: space-between; padding: 14px; margin-top: 10px; background: #f1f5f9; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 My Tasks</h1>
            <form action="/logout" method="post"><button type="submit">Logout</button></form>
        </div>
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Enter a task...">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>
        <ul id="taskList">
            {% for task in tasks %}
            <li>
                <span>{{ task.name }}</span>
                <div>
                    <button class="edit-btn" onclick="editTask({{ task.id }}, '{{ task.name }}')">Edit</button>
                    <button class="delete-btn" onclick="deleteTask({{ task.id }})">Delete</button>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>
    <script>
        async function addTask() {
            const input = document.getElementById("taskInput");
            const response = await fetch("/tasks", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({task: input.value}) });
            location.reload();
        }
        async function editTask(id, name) {
            const newName = prompt("Edit:", name);
            if (newName) await fetch(`/tasks/${id}`, { method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify({task: newName}) });
            location.reload();
        }
        async function deleteTask(id) {
            await fetch(`/tasks/${id}`, { method: "DELETE" });
            location.reload();
        }
    </script>
</body>
</html>
