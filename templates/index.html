<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 60px 20px;
            transition: all 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }

        .theme-toggle {
            background: var(--border);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text-main);
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .add-btn { background: var(--primary); color: white; }
        .add-btn:hover { background: var(--primary-hover); }

        ul { list-style: none; padding: 0; }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .task-info span { display: block; }
        .task-name { font-weight: 500; }
        .timestamp { font-size: 0.75rem; color: var(--text-muted); }

        .actions { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 10px; font-size: 0.75rem; }
        .edit-btn { background: var(--warning); color: white; }
        .delete-btn { background: var(--danger); color: white; }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Tasks</h1>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </header>

        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <input type="text" id="searchInput" placeholder="Search tasks..." onkeyup="filterTasks()" style="width: 100%; box-sizing: border-box; margin-bottom: 1rem;">

        <ul id="taskList">
            {% for task in tasks %}
            <li class="task-item" data-name="{{ task.name|lower }}">
                <div class="task-info">
                    <span class="task-name">{{ task.name }}</span>
                    <span class="timestamp">{{ task.created_at[:16].replace('T', ' ') }}</span>
                </div>
                <div class="actions">
                    <button class="edit-btn btn-sm" onclick="editTask({{ task.id }}, '{{ task.name }}')">Edit</button>
                    <button class="delete-btn btn-sm" onclick="deleteTask({{ task.id }})">Delete</button>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>

    <script>
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);

        function toggleTheme() {
            const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function filterTasks() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            document.querySelectorAll(".task-item").forEach(item => {
                item.style.display = item.dataset.name.includes(query) ? "flex" : "none";
            });
        }

        async function addTask() {
            const input = document.getElementById("taskInput");
            if (!input.value.trim()) return;
            await fetch("/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ task: input.value.trim() })
            });
            location.reload();
        }

        async function editTask(id, name) {
            const newName = prompt("Edit task:", name);
            if (!newName || newName.trim() === "") return;
            await fetch(`/tasks/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ task: newName.trim() })
            });
            location.reload();
        }

        async function deleteTask(id) {
            if (!confirm("Delete this task?")) return;
            await fetch(`/tasks/${id}`, { method: "DELETE" });
            location.reload();
        }
    </script>
</body>
</html>
