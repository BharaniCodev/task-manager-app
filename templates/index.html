<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Manager</title>

    <style>
        :root {
            --bg-color: #f4f6f8;
            --container-bg: white;
            --text-color: #333;
            --input-border: #ccc;
            --li-bg: #f1f5f9;
            --timestamp-color: #64748b;
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --container-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --input-border: #444;
            --li-bg: #3d3d3d;
            --timestamp-color: #aaa;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1, h2 { color: var(--text-color); }

        .theme-toggle {
            float: right;
            padding: 8px 12px;
            cursor: pointer;
            background: #64748b;
            color: white;
            border: none;
            border-radius: 6px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 6px;
            background: var(--container-bg);
            color: var(--text-color);
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn { background: #2563eb; color: white; padding: 12px 18px; }
        .edit-btn { background: #f59e0b; color: white; }
        .delete-btn { background: #dc2626; color: white; }

        ul { list-style: none; padding: 0; }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            margin-top: 10px;
            background: var(--li-bg);
            border-radius: 6px;
        }

        .task-actions { display: flex; gap: 8px; }
        .task-info { display: flex; flex-direction: column; }
        .timestamp { font-size: 0.8em; color: var(--timestamp-color); }
        .empty { text-align: center; color: #777; margin-top: 20px; }
    </style>
</head>

<body>

    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
        <h1>📝 My Cloud Task Manager</h1>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Enter a task...">
            <button class="add-btn" onclick="addTask()">Add</button>
        </div>

        <div class="input-area">
            <input type="text" id="searchInput" placeholder="Search tasks..." onkeyup="filterTasks()">
        </div>

        <h2>Tasks</h2>

        <ul id="taskList">
            {% for task in tasks %}
            <li class="task-item" data-name="{{ task.name|lower }}">
                <div class="task-info">
                    <span>{{ task.name }}</span>
                    {% if task.created_at %}
                    <span class="timestamp">{{ task.created_at[:16].replace('T', ' ') }} UTC</span>
                    {% endif %}
                </div>
                <div class="task-actions">
                    <button class="edit-btn" data-task-id="{{ task.id }}" data-task-name="{{ task.name }}"
                        onclick="editTask(this.dataset.taskId, this.dataset.taskName)">Edit</button>
                    <button class="delete-btn" data-task-id="{{ task.id }}"
                        onclick="deleteTask(this.dataset.taskId)">Delete</button>
                </div>
            </li>
            {% endfor %}
        </ul>

        <div class="empty" id="emptyMessage" style="display: {% if tasks %}none{% else %}block{% endif %};">
            No tasks yet.
        </div>
        
        <div class="empty" id="noMatchMessage" style="display: none;">
            No tasks match your search.
        </div>
    </div>

    <script>
        // Theme handling
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);

        function toggleTheme() {
            let theme = document.documentElement.getAttribute('data-theme');
            let newTheme = theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function filterTasks() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const tasks = document.getElementsByClassName("task-item");
            const emptyMsg = document.getElementById("emptyMessage");
            const noMatchMsg = document.getElementById("noMatchMessage");
            let visibleCount = 0;

            for (let task of tasks) {
                const name = task.getAttribute("data-name");
                if (name.includes(query)) {
                    task.style.display = "flex";
                    visibleCount++;
                } else {
                    task.style.display = "none";
                }
            }

            if (tasks.length === 0) {
                emptyMsg.style.display = "block";
                noMatchMsg.style.display = "none";
            } else {
                emptyMsg.style.display = "none";
                noMatchMsg.style.display = visibleCount === 0 ? "block" : "none";
            }
        }

        async function addTask() {
            const input = document.getElementById("taskInput");
            const taskName = input.value.trim();
            if (!taskName) {
                alert("Please enter a task.");
                return;
            }
            const response = await fetch("/tasks", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ task: taskName })
            });
            const data = await response.json();
            if (data.error) {
                alert(data.error);
                return;
            }
            input.value = "";
            location.reload();
        }

        async function editTask(taskId, currentName) {
            const newName = prompt("Edit task:", currentName);
            if (newName === null || newName.trim() === "") return;
            const response = await fetch(`/tasks/${taskId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ task: newName.trim() })
            });
            if (!response.ok) {
                alert("Failed to update task.");
                return;
            }
            location.reload();
        }

        async function deleteTask(taskId) {
            const response = await fetch(`/tasks/${taskId}`, { method: "DELETE" });
            if (!response.ok) {
                alert("Failed to delete task.");
                return;
            }
            location.reload();
        }
    </script>
</body>
</html>
